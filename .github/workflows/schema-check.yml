name: Schema check

# Compares the live API schema with openapi/schema.json every week, and opens
# (or comments on) one issue when they differ.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Report a changed schema
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: API schema changed
        run: |
          if git diff --quiet -- openapi/schema.json; then
            echo "The API schema is unchanged."
            exit 0
          fi
          {
            echo "The live API schema differs from \`openapi/schema.json\` (checked $(date -u +%F))."
            echo
            echo "Run \`npm run generate\`, review the changes and open a pull request."
            echo
            echo '```'
            git diff --stat -- openapi/schema.json src/generated
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
