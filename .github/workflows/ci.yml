name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev tools (Vitest, ESLint, tsup) need Node 22 or newer.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  runtimes:
    # The library supports older Node versions than its dev tools do, so the
    # built package is loaded on each supported Node without installing them.
    name: Load the build (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run check:dist
